[workspace]
members = [".", "migration"]

[package]
name = "postgres-temporal"
license = "MIT"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = "0.8.22"
leptos_meta = "0.8"
leptos_axum = { version = "0.8", optional = true }
axum = { version = "0.8", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
migration = { path = "migration", optional = true }
sea-orm = { version = "2.0", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"], optional = true }
serde = { version = "1", features = ["derive"] }
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
hydrate = ["leptos/hydrate", "dep:wasm-bindgen", "dep:console_error_panic_hook"]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "dep:leptos_axum",
    "dep:axum",
    "dep:tokio",
    "dep:sea-orm",
    "dep:migration",
]

[package.metadata.leptos]
output-name = "postgres-temporal"
site-root = "target/site"
site-pkg-dir = "pkg"
site-addr = "127.0.0.1:3000"
tailwind-input-file = "tailwind.css"
assets-dir = "assets"
bin-features = ["ssr"]
lib-features = ["hydrate"]
